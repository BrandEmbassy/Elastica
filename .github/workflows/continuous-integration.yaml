name: 'Continuous integration'
on: ['push', 'pull_request']
jobs:
  cs:
    runs-on: 'ubuntu-latest'
    name: 'Coding style'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Setup PHP'
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '8.2'
          coverage: 'none'
          extensions: 'json, mbstring, tokenizer'
          tools: 'composer-normalize:2.28.0, php-cs-fixer:3.94.2'

      - name: 'Check PHP code'
        run: |
          php-cs-fixer fix --diff --dry-run --allow-risky=yes --using-cache=no

      - name: 'Check composer.json'
        run: |
          composer-normalize --diff --dry-run --indent-size=4 --indent-style=space --no-update-lock

  phpunit:
    runs-on: 'ubuntu-latest'
    name: 'PHPUnit (PHP ${{ matrix.php }}, ES ${{ matrix.elasticsearch }})'
    timeout-minutes: 10
    strategy:
      matrix:
        php:
          - '8.2'
          - '8.3'
        elasticsearch:
          - '9.3.0'
      fail-fast: false
    services:
      elasticsearch:
        image: 'docker.elastic.co/elasticsearch/elasticsearch:${{ matrix.elasticsearch }}'
        env:
          discovery.type: 'single-node'
          xpack.security.enabled: 'false'
          xpack.security.transport.ssl.enabled: 'false'
          ES_JAVA_OPTS: '-Xms512m -Xmx512m'
          action.destructive_requires_name: 'false'
          path.repo: '/usr/share/elasticsearch/repository'
        ports:
          - '9200:9200'
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Setup PHP'
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '${{ matrix.php }}'
          coverage: 'pcov'
          tools: 'pecl, composer:v2'
          extensions: 'curl, json, mbstring, openssl'

      - name: 'Get composer cache directory'
        id: 'composer_cache'
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: 'Cache dependencies'
        uses: 'actions/cache@v4'
        with:
          path: '${{ steps.composer_cache.outputs.dir }}'
          key: '${{ runner.os }}-composer-php${{ matrix.php }}-${{ hashFiles(''**/composer.json'') }}'
          restore-keys: |
            ${{ runner.os }}-composer-php${{ matrix.php }}-
            ${{ runner.os }}-composer-

      - name: 'Update dependencies'
        run: |
          composer update --prefer-dist --no-interaction --no-progress --ansi ${{ matrix.composer_flags }}

      - name: 'Run unit tests'
        run: |
          vendor/bin/phpunit --group unit --coverage-clover=build/coverage/unit-coverage.xml

      - name: 'Run functional tests'
        run: |
          vendor/bin/phpunit --group functional --coverage-clover=build/coverage/functional-coverage.xml
        env:
          ES_HOST: 'localhost'
          ES_PORT: '9200'

      - name: 'Upload coverage to Codecov'
        uses: codecov/codecov-action@v4
        with:
            files: build/coverage/unit-coverage.xml,build/coverage/functional-coverage.xml

  phpstan:
    runs-on: 'ubuntu-latest'
    name: 'PHPStan (PHP ${{ matrix.php }})'
    timeout-minutes: 10
    strategy:
      matrix:
        php:
          - '8.2'
      fail-fast: false
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'

      - name: 'Setup PHP'
        uses: 'shivammathur/setup-php@v2'
        with:
          php-version: '${{ matrix.php }}'
          coverage: 'none'
          tools: 'pecl, composer:v2'
          extensions: 'curl, json, mbstring, openssl'

      - name: 'Get composer cache directory'
        id: 'composer_cache'
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: 'Cache dependencies'
        uses: 'actions/cache@v4'
        with:
          path: '${{ steps.composer_cache.outputs.dir }}'
          key: '${{ runner.os }}-composer-php${{ matrix.php }}-${{ hashFiles(''**/composer.json'') }}'
          restore-keys: |
            ${{ runner.os }}-composer-php${{ matrix.php }}-
            ${{ runner.os }}-composer-

      - name: 'Update dependencies'
        run: |
          composer update --prefer-dist --no-interaction --no-progress --ansi ${{ matrix.composer_flags }}

      - name: 'Run phpstan'
        run: |
          vendor/bin/phpstan analyse --no-progress --error-format=github
